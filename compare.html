<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bulan Water-Watch | Compare Prices</title>

    <link rel="stylesheet" href="css/compare.css">
</head>

<body>

    <main class="app-container">

        <header class="app-header">
            <button class="menu-button" id="menuButton" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="header-brand">
                <h2>BULAN WATER WATCH</h2>
                <p>BULAN, SORSOGON</p>
            </div>
        </header>

         <section class="search-section">
            <label for="searchStation">Search Station</label>

            <input
                type="search"
                id="searchStation"
                placeholder="Station name or location"
            >
        </section>

        <div class="station-heading">
            <h2>Water Stations</h2>
            <span id="stationCount"></span>
        </div>

        <section class="station-list" id="stationList"></section>

        <div class="no-result" id="noResult" style="display:none;">
            <h3>No stations found</h3>
            <p>Try another station or location.</p>
        </div>

    </main>

    <div class="menu-overlay" id="menuOverlay"></div>

    <aside class="side-menu" id="sideMenu">

         <div class="menu-header">

            <div class="menu-brand">

                <div class="menu-logo">
                    <svg viewBox="0 0 64 64"
                         xmlns="http://www.w3.org/2000/svg">

                        <path
                            d="M32 4 C25 17 12 29 12 40
                            C12 51 21 60 32 60
                            C43 60 52 51 52 40
                            C52 29 39 17 32 4Z"
                            fill="#55BFCB"
                        />

                        <path
                            d="M19 41 C25 35 31 47 38 41
                            C43 37 47 39 49 40"
                            fill="none"
                            stroke="#fff"
                            stroke-width="3"
                            stroke-linecap="round"
                        />

                    </svg>
                </div>

                <h2>BULAN WATER WATCH</h2>
                <p>BULAN, SORSOGON</p>

            </div>

            <button class="close-menu"
                    id="closeMenu"
                    aria-label="Close menu">
                &times;
            </button>

        </div>

         <nav class="menu-links">

            <a href="compare.html" class="menu-link active">
                Compare Prices
            </a>

            <a href="group-orders.html" class="menu-link">
                Group Orders
            </a>

            <a href="my-orders.html" class="menu-link">
                My Orders
            </a>

            <a href="profile.html" class="menu-link">
                Profile
            </a>

        </nav>

        <div class="menu-footer">
            Bulan Water-Watch
        </div>

    </aside>

     <script>
        const menuButton = document.getElementById("menuButton");
        const closeMenu = document.getElementById("closeMenu");
        const sideMenu = document.getElementById("sideMenu");
        const menuOverlay = document.getElementById("menuOverlay");

        function openMenu() {
            sideMenu.classList.add("show");
            menuOverlay.classList.add("show");
            document.body.classList.add("menu-open");
        }

        function hideMenu() {
            sideMenu.classList.remove("show");
            menuOverlay.classList.remove("show");
            document.body.classList.remove("menu-open");
        }

        menuButton.addEventListener("click", openMenu);
        closeMenu.addEventListener("click", hideMenu);
        menuOverlay.addEventListener("click", hideMenu);

        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                hideMenu();
            }
        });
    </script>

    <script src="js/compare.js"></script>

</body>
</html>
